<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- AURA-TAB-SYMBOL-START | Inhalt erzeugt von tools/branding/build-logos.mjs, nicht von Hand bearbeiten.
         SVG zuerst: enthaelt schwarzes und weisses Motiv und folgt dem Hell/Dunkel-Modus
         des Browsers. Browser ohne SVG-Favicon-Unterstuetzung nehmen die PNGs darunter. -->
    <!-- ausgeschaltet ueber /logo-tausch: der Browser zeigt sein Standardsymbol -->
    <!-- AURA-TAB-SYMBOL-ENDE -->
    <!-- AURA-APP-SYMBOL-START | Inhalt erzeugt von tools/branding/build-logos.mjs, nicht von Hand bearbeiten. -->
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- AURA-APP-SYMBOL-ENDE -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Bewusst KEIN apple-mobile-web-app-status-bar-style (03.11.2026, iOS 27):
         'black-translucent' schaltet den Mechanismus ab, mit dem WebKit den
         Milchglas-Streifen oben weglaesst (siehe #aura-topedge unten). Ohne den
         Eintrag ist die Statusleiste 'default': iOS faerbt sie in der Farbe des
         Randstreifens. Welche Farbe Uhr/Akku bekommen, entscheidet iOS selbst
         (nicht dokumentiert, von uns nicht gezielt gesteuert).
         iOS liest den Wert nur beim Hinzufuegen zum Homebildschirm - ein schon
         installiertes Symbol behaelt den alten Stil bis zum Neu-Hinzufuegen. -->
    <meta name="apple-mobile-web-app-title" content="Aura" />
    <title>Aura – ioBroker Dashboard</title>
    <script>
      /* Seitenweites Pinch-Zoom verhindern: iOS Safari verschiebt nach einer
         Pinch-Geste (auch nur auseinanderziehen und loslassen) manchmal den
         sichtbaren Viewport dauerhaft gegenueber dem Layout-Viewport, wodurch
         die randlose Kopfzeile (env(safe-area-inset-*), siehe .aura-header
         unten) sichtbar verrutscht. Die viewport-Meta (user-scalable=no) allein
         reicht auf iOS Safari/Homescreen-PWA oft nicht - deshalb zusaetzlich
         die Safari-Gesture-Events abfangen. Betrifft NUR das Pinch-Zoom der
         Seite: Leaflets eigenes Pinch-to-Zoom der Karte (MapWidget) laeuft
         ueber touchstart/touchmove, ein separater Event-Strom, und bleibt
         unberuehrt. */
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (type) {
        document.addEventListener(type, function (e) { e.preventDefault(); }, { passive: false });
      });
    </script>
    <script>
      /* Wisch-vom-Bildschirmrand als Browser-Vor/Zurueck verhindern (bestaetigt
         18.08.2026 am iPhone, Homescreen-App): iOS deutet ein Wischen, das ganz
         am linken/rechten Rand beginnt, als Verlaufs-Navigation - auch ganz ohne
         Safari-Oberflaeche. Das ist eine systemnahe UIKit-Geste (kein CSS-Scroll-
         Verhalten), die die touch-action-Regel oben (html, body) NICHT zuverlaessig
         stoppt. Einziger verlaesslicher Weg: den Touch selbst per preventDefault
         als "von der Seite beansprucht" markieren, solange er in der aeussersten
         Randzone beginnt. .aura-page haelt genau diese Zone per safe-area-inset
         ohnehin frei von Inhalten (siehe .aura-page unten) - es geht also kein
         Klick-Ziel verloren. Nur Einzelfinger-Touches (sonst Konflikt mit
         Leaflets Pinch-to-Zoom auf der Karte). */
      (function () {
        var EDGE_PX = 24;
        function startsAtEdge(e) {
          if (e.touches.length !== 1) return false;
          var x = e.touches[0].clientX;
          return x <= EDGE_PX || x >= window.innerWidth - EDGE_PX;
        }
        ['touchstart', 'touchmove'].forEach(function (type) {
          document.addEventListener(type, function (e) { if (startsAtEdge(e)) e.preventDefault(); }, { passive: false });
        });
      })();
    </script>
    <script>
      /* Kopfzeile nach dem Drehen weg (gemeldet 05.11.2026, seit aura-2.5.1):
         In der Homescreen-App quer und wieder hoch gedreht, danach lag die
         Kopfzeile samt Menue-Knopf dauerhaft ueber dem Bildschirmrand, nur ein
         App-Neustart half. Die Kopfzeile ist kein festes Element, sie liegt
         oben im Fluss - verschwindet sie, ist die GANZE Seite verschoben.
         Zurueckscrollen geht nicht, weil html/body im Frontend bewusst
         overflow:hidden haben (siehe unten).
         Am iPhone gemessen (05.11.2026, iOS 27, Fenster 402x812, Screen
         402x874): nach dem Zurueckdrehen scrollY=34, visualViewport.offsetTop=0.
         Die 34 px sind genau die Zusatzhoehe env(safe-area-inset-bottom) aus
         html/body (100dvh + sab, siehe unten): Das Dokument ist um sie hoeher
         als das Fenster, und iOS scrollt beim Drehen bis ans Ende. Vor 2.5.1
         (black-translucent) aenderte sich das Fenster beim Drehen nicht auf
         diese Weise, seitdem haelt iOS hochkant oben Platz fuer die
         Statusleiste frei und blendet sie quer aus.
         Abhilfe: Die Seite selbst scrollt im Frontend nie (nur .aura-scroll
         innen), also jede Verschiebung des Dokuments sofort auf 0 zuruecksetzen.
         Nicht, solange ein Eingabefeld den Fokus hat - dort darf iOS die Seite
         fuer die Tastatur schieben. Nur iOS als Homescreen-App, wie
         #aura-topedge. Jeder Eingriff wird mit Vorher/Nachher-Werten in
         window.__auraTopFix notiert (Beleg fuer die Ursache, das Messfenster
         im Dev-Server zeigt ihn an, siehe src-vis/devtools/viewportProbe.ts). */
      (function () {
        var ios = window.CSS && CSS.supports && CSS.supports('-webkit-touch-callout', 'none');
        var standalone = window.navigator.standalone === true ||
          (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
        if (!ios || !standalone) return;
        var rec = window.__auraTopFix = { enabled: true, checks: 0, resets: 0, log: [] };
        function editing() {
          var a = document.activeElement;
          if (!a) return false;
          var t = a.tagName;
          return t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT' || a.isContentEditable;
        }
        function measure() {
          var se = document.scrollingElement || document.documentElement;
          var vv = window.visualViewport;
          return {
            scrollY: Math.round(window.scrollY || se.scrollTop || 0),
            scrollX: Math.round(window.scrollX || se.scrollLeft || 0),
            bodyTop: Math.round(document.body ? document.body.scrollTop : 0),
            vvTop: vv ? Math.round(vv.offsetTop) : 0,
            win: window.innerWidth + 'x' + window.innerHeight
          };
        }
        function check(reason) {
          rec.checks++;
          if (!rec.enabled || !document.querySelector('.aura-page') || editing()) return;
          var before = measure();
          if (!before.scrollY && !before.scrollX && !before.bodyTop && !before.vvTop) return;
          window.scrollTo(0, 0);
          var se = document.scrollingElement || document.documentElement;
          if (se.scrollTop) se.scrollTop = 0;
          if (document.body && document.body.scrollTop) document.body.scrollTop = 0;
          var entry = { reason: reason, at: new Date().toLocaleTimeString(), before: before, after: null };
          rec.resets++;
          rec.log.unshift(entry);
          if (rec.log.length > 8) rec.log.length = 8;
          requestAnimationFrame(function () { entry.after = measure(); });
        }
        function burst(reason) {
          [0, 150, 500, 1200].forEach(function (ms) { setTimeout(function () { check(reason); }, ms); });
        }
        rec.check = check;
        window.addEventListener('scroll', function () { check('scroll'); }, { passive: true });
        window.addEventListener('resize', function () { burst('resize'); });
        window.addEventListener('orientationchange', function () { burst('orientationchange'); });
        window.addEventListener('pageshow', function () { burst('pageshow'); });
        document.addEventListener('visibilitychange', function () { if (!document.hidden) burst('visible'); });
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', function () { burst('vv-resize'); });
          window.visualViewport.addEventListener('scroll', function () { check('vv-scroll'); });
        }
      })();
    </script>
    <style>
      :root { --aura-boot-bg: #0f172a; --aura-boot-fg: #94a3b8; }
      /* iOS-Homescreen-App: randlos. Auras Theme-Hintergrund fuellt die ganze
         Flaeche bis an alle Kanten -> kein toter Balken oben/unten. Der Inhalt
         wird nur aus Dynamic Island (oben) und Home-Indicator (unten) gehalten,
         der Hintergrund laeuft darunter durch. */
      /* Seitliches Wischen auf Seitenebene sperren: pan-x hier erlaubte dem
         Browser, ein Wischen von links/rechts als "Zurueck/Vor im Verlauf"
         zu deuten (Chrome/Edge-Randgeste, iOS-Homescreen-App-Randgeste).
         Vertikales Scrollen (pan-y) bleibt erlaubt. overscroll-behavior-x
         nimmt Chrome zusaetzlich die Randgeste weg. Einzelne Widgets, die
         selbst seitlich scrollen (Tableiste, Karussell, Wetterstreifen, ...),
         erlauben pan-x lokal wieder - siehe .overflow-x-auto in index.css
         und die betroffenen Widget-Dateien. */
      html, body { background: var(--app-bg, #0f172a); touch-action: pan-y; overscroll-behavior-x: none; }
      /* Vollbild bis zur PHYSISCHEN Unterkante. iOS gibt einer Homescreen-Web-App
         ein Fenster, das um env(safe-area-inset-bottom) (Home-Indicator, ~34px)
         kuerzer ist als der Screen (per Messung belegt: innerHeight endet 34px
         ueber der Kante). Deshalb Hoehe = 100dvh + safe-area-inset-bottom, damit
         der Inhalt die Home-Indicator-Zone mitfuellt (kein toter Streifen unten).
         KEIN position:fixed (reicht auf iOS nicht in die Zone). Gummiband gesperrt
         per overflow:hidden + overscroll-behavior. Nur Frontend (:has(.aura-page)),
         Admin bleibt normal scrollbar. */
      html:has(.aura-page), body:has(.aura-page) {
        height: calc(100dvh + env(safe-area-inset-bottom));
        min-height: calc(100dvh + env(safe-area-inset-bottom));
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* Body als Flex-Spalte, #root fuellt sie per flex:1 -> die volle Hoehe
         propagiert bis .aura-page/Scroll durch (die height:100%-Prozentkette
         propagiert auf iOS NICHT sauber bis #root). */
      body:has(.aura-page) { display: flex; flex-direction: column; }
      #root { flex: 1 1 auto; min-height: 0; }
      /* Seitliche Notch-Raender: .aura-page haelt den Inhalt aus der Safe-Area
         (links/rechts) heraus. Der Hintergrund dieser Streifen ist das dunkle
         --app-bg (Inline-Style von .aura-page) -> UNTER der Tab-Leiste "atmen" die
         Seitenstreifen im gleichen Dunkelblau wie der Inhalt (nicht eingeklemmt). */
      .aura-page {
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      /* Kopfzeile UND Tab-Leiste randlos (full-bleed): ihre Flaeche (--app-surface)
         und ihre untere Trennlinie laufen ueber die GANZE Breite - auch durch die
         Notch-Streifen. Dazu per negativer Margin bis an die Bildschirmkante ziehen
         und die Safe-Area als Innenabstand wieder aufschlagen, damit Logo/Tabs NICHT
         unter die Notch rutschen. Die Kopfzeile zieht zusaetzlich bis unter die
         Statusleiste (env(safe-area-inset-top)). Desktop: env(...) = 0 -> kein Effekt. */
      .aura-page .aura-header {
        margin-left: calc(-1 * env(safe-area-inset-left));
        margin-right: calc(-1 * env(safe-area-inset-right));
        padding-top: calc(0.5rem + env(safe-area-inset-top));
        padding-bottom: 0.5rem;
        padding-left: calc(1rem + env(safe-area-inset-left));
        padding-right: calc(1rem + env(safe-area-inset-right));
      }
      .aura-page .aura-tabs {
        margin-left: calc(-1 * env(safe-area-inset-left));
        margin-right: calc(-1 * env(safe-area-inset-right));
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      /* NUR der Dashboard-Inhalt scrollt (bei Bedarf) und haelt einen Abstand
         zum Home-Indicator. overscroll-behavior stoppt das Weiterziehen auf
         die ganze Seite. Nicht die Tab-Leiste/Widget-Zeilen (gleiche Klasse).
         War frueher 0.25rem: bei hohem Tab-Inhalt (z.B. zwei gestapelten
         Wetter-Widgets) reichte das auf iOS Safari nicht - die letzte Zeile
         war nur waehrend des elastischen Ueberzieh-Gummibands sichtbar und
         verschwand beim Loslassen wieder (normales Scrollen kam nicht ganz
         bis ans Ende). Grosszuegigerer Puffer behebt das unabhaengig vom
         genauen iOS-Mechanismus. KEIN env(safe-area-inset-bottom) hier - das
         wuerde die bewusste "Inhalt fuellt bis zur physischen Kante"-Vollbild-
         Loesung oben (100dvh + sab) wieder mit einer toten Zone unterlaufen. */
      .aura-page .aura-scroll.inset-0 {
        padding-bottom: 4rem;
        overscroll-behavior: contain;
      }
      /* iOS 27 legt in Homescreen-Web-Apps einen Milchglas-Streifen ueber den
         oberen Rand (WebKit-Bug 325807, auf iOS 27.2 offen). WebKit laesst ihn
         nur weg, wenn oben mittig (4px tief) ein position:fixed-Element liegt,
         das mind. 90% breit und hoeher als 10px ist und nicht durchsichtig.
         Dessen background-color (berechneter Stil, nicht gemalte Pixel) faerbt
         dann die Statusleiste. background-clip:text auf einem LEEREN Element
         liefert die Farbe, ohne etwas zu malen - der Streifen ist unsichtbar
         und verdeckt nichts von der Kopfzeile. pointer-events:none laesst Taps
         durch. Nur iOS (-webkit-touch-callout) und nur als Homescreen-App.
         Belegt auf iPhone/iOS 27.2 in kuraneko1/dsh-mobile-maxxing#91. */
      #aura-topedge { display: none; }
      @supports (-webkit-touch-callout: none) {
        @media (display-mode: standalone) {
          #aura-topedge {
            display: block;
            position: fixed; top: 0; left: 0; right: 0;
            height: 11px;
            z-index: 2147483647;
            pointer-events: none;
            background-color: var(--app-bg, #0f172a);
            -webkit-background-clip: text;
            background-clip: text;
          }
          /* Mit Kopfzeile oben: deren Flaeche, damit Statusleiste und Kopfzeile
             nahtlos ineinander uebergehen. */
          body:has(.aura-header) #aura-topedge { background-color: var(--app-surface, #1e293b); }
        }
      }
      #aura-boot {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px;
        background: var(--aura-boot-bg); color: var(--aura-boot-fg);
        font-family: system-ui, sans-serif; font-size: 13px;
        z-index: 9999;
        transition: opacity 0.25s ease-out;
      }
      #aura-boot.hidden { opacity: 0; pointer-events: none; }
      #aura-boot-bar-wrap {
        position: absolute; top: 0; left: 0; right: 0; height: 2px;
        background: rgba(255,255,255,0.08);
      }
      #aura-boot-bar {
        height: 100%; background: #6366f1;
        animation: aura-slide 1.4s ease-in-out infinite;
      }
      #aura-boot-spinner {
        width: 28px; height: 28px; border-radius: 50%;
        border: 2px solid #6366f1; border-top-color: transparent;
        animation: aura-spin 0.7s linear infinite;
      }
      @keyframes aura-slide {
        0%   { transform: translateX(-100%) scaleX(0.3); }
        50%  { transform: translateX(0%)    scaleX(0.7); }
        100% { transform: translateX(100%) scaleX(0.3); }
      }
      @keyframes aura-spin {
        to { transform: rotate(360deg); }
      }
      #aura-boot-diag {
        display: flex; flex-direction: column; align-items: center; gap: 10px;
        max-width: 34em; padding: 0 24px;
        text-align: center; line-height: 1.55;
      }
      #aura-boot-diag[hidden] { display: none; }
      #aura-boot-text.is-error { font-size: 15px; font-weight: 600; }
      #aura-boot-diag-dev {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px; opacity: 0.75; word-break: break-all;
      }
      #aura-boot-reload {
        margin-top: 4px; padding: 6px 14px; border-radius: 6px;
        border: 1px solid currentColor; background: transparent;
        color: inherit; font: inherit; cursor: pointer;
      }
      #aura-boot-reload:hover { border-color: #6366f1; color: #6366f1; }
    </style>
    <script>
      // Repaint the boot splash in the mode this device is about to show. The mode
      // follows the same order as resolveActiveMode in the app: local choice
      // ('aura-device-theme' = light | dark), then the datapoint mode cached in
      // 'aura-theme-mode', then the system setting. Colours come from the pair
      // ThemeProvider wrote as "<--app-bg>|<--text-secondary>" per mode; the old
      // single 'aura-boot-colors' is the fallback. Without it the splash is
      // hard-coded dark, so a light device flashes dark on every reload.
      try {
        var ls = window.localStorage;
        var m = ls.getItem('aura-device-theme');
        if (m !== 'light' && m !== 'dark') m = ls.getItem('aura-theme-mode');
        if (m !== 'light' && m !== 'dark') {
          m = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        var c = (ls.getItem('aura-boot-colors-' + m) || ls.getItem('aura-boot-colors') || '').split('|');
        var r = document.documentElement.style;
        r.colorScheme = m;
        if (c.length === 2 && c[0] && c[1]) {
          r.setProperty('--aura-boot-bg', c[0]);
          r.setProperty('--aura-boot-fg', c[1]);
          r.setProperty('--app-bg', c[0]);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="aura-topedge" aria-hidden="true"></div>
    <div id="aura-boot">
      <div id="aura-boot-bar-wrap"><div id="aura-boot-bar"></div></div>
      <div id="aura-boot-spinner"></div>
      <span id="aura-boot-text">Aura wird geladen…</span>
      <div id="aura-boot-diag" hidden>
        <div id="aura-boot-diag-detail"></div>
        <div id="aura-boot-diag-dev"></div>
        <button type="button" id="aura-boot-reload">Neu laden</button>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // Watchdog for the boot splash. socket.io.js below is a parser-blocking
      // script: if the ioBroker server accepts the TCP connection but never
      // answers (hung js-controller, overloaded host), that request never
      // finishes, main.tsx never runs, and the splash spins forever with no
      // explanation. Timers do keep firing while the parser waits on a script,
      // so this runs even in that state — it is the only layer that can report
      // the hang, since no application code has executed yet.
      (function () {
        var TIMEOUT_MS = 8000;
        function ioReady() {
          var lib = window.io;
          return !!lib && typeof lib.connect === 'function';
        }
        setTimeout(function () {
          if (ioReady()) return; // library arrived, boot is progressing
          var boot = document.getElementById('aura-boot');
          if (!boot || boot.classList.contains('hidden')) return; // app already painted
          var text = document.getElementById('aura-boot-text');
          if (text) {
            text.textContent = 'ioBroker antwortet nicht';
            text.className = 'is-error';
          }
          var detail = document.getElementById('aura-boot-diag-detail');
          if (detail) {
            detail.textContent =
              'socket.io.js wurde nach ' + TIMEOUT_MS / 1000 + ' Sekunden nicht geladen. ' +
              'Prüfe, ob ioBroker unter ' + window.location.origin + ' läuft.';
          }
          // Only the dev server knows a proxy target; a production build is
          // served by ioBroker itself, where naming an origin adds nothing.
          var target = window.__auraDevProxyTarget;
          var dev = document.getElementById('aura-boot-diag-dev');
          if (dev && target) dev.textContent = 'Dev-Proxy-Ziel: ' + target + ' (aus .iobroker-url)';
          var btn = document.getElementById('aura-boot-reload');
          if (btn) btn.onclick = function () { window.location.reload(); };
          var diag = document.getElementById('aura-boot-diag');
          if (diag) diag.hidden = false;
        }, TIMEOUT_MS);
      })();
    </script>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/src-vis/main.tsx"></script>
  </body>
</html>
