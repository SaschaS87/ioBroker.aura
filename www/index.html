    <script>
      /* Statusleisten-Symbole (Uhr/WLAN/Akku) an Auras Hell/Dunkel-Modus koppeln:
         dunkler Modus -> weisse Symbole (black-translucent), heller Modus ->
         dunkle Symbole (default). Aura setzt dazu die Klasse 'dark' auf <html>.
         iOS liest den Wert beim App-Start; nach einem Live-Wechsel ggf. die App
         einmal schliessen und neu oeffnen, damit die Symbolfarbe umspringt. */
      (function () {
        var meta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        var KEY = 'aura-status-dark';
        try {
          var cached = localStorage.getItem(KEY);
          if (meta && cached !== null) {
            meta.setAttribute('content', cached === '1' ? 'black-translucent' : 'default');
          }
        } catch (e) {}
        function sync() {
          var dark = document.documentElement.classList.contains('dark');
          if (meta) meta.setAttribute('content', dark ? 'black-translucent' : 'default');
          try { localStorage.setItem(KEY, dark ? '1' : '0'); } catch (e) {}
        }
        new MutationObserver(sync).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
        document.addEventListener('DOMContentLoaded', sync);
      })();
    </script>
    <script>
      /* Seitenweites Pinch-Zoom verhindern: iOS Safari verschiebt nach einer
         Pinch-Geste (auch nur auseinanderziehen und loslassen) manchmal den
         sichtbaren Viewport dauerhaft gegenueber dem Layout-Viewport, wodurch
         die randlose Kopfzeile (env(safe-area-inset-*), siehe .aura-header
         unten) sichtbar verrutscht. Die viewport-Meta (user-scalable=no) allein
         reicht auf iOS Safari/Homescreen-PWA oft nicht - deshalb zusaetzlich
         die Safari-Gesture-Events abfangen. Betrifft NUR das Pinch-Zoom der
         Seite: Leaflets eigenes Pinch-to-Zoom der Karte (MapWidget) laeuft
         ueber touchstart/touchmove, ein separater Event-Strom, und bleibt
         unberuehrt. */
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (type) {
        document.addEventListener(type, function (e) { e.preventDefault(); }, { passive: false });
      });
    </script>
    <script>
      /* Wisch-vom-Bildschirmrand als Browser-Vor/Zurueck verhindern (bestaetigt
         18.08.2026 am iPhone, Homescreen-App): iOS deutet ein Wischen, das ganz
         am linken/rechten Rand beginnt, als Verlaufs-Navigation - auch ganz ohne
         Safari-Oberflaeche. Das ist eine systemnahe UIKit-Geste (kein CSS-Scroll-
         Verhalten), die die touch-action-Regel oben (html, body) NICHT zuverlaessig
         stoppt. Einziger verlaesslicher Weg: den Touch selbst per preventDefault
         als "von der Seite beansprucht" markieren, solange er in der aeussersten
         Randzone beginnt. .aura-page haelt genau diese Zone per safe-area-inset
         ohnehin frei von Inhalten (siehe .aura-page unten) - es geht also kein
         Klick-Ziel verloren. Nur Einzelfinger-Touches (sonst Konflikt mit
         Leaflets Pinch-to-Zoom auf der Karte). */
      (function () {
        var EDGE_PX = 24;
        function startsAtEdge(e) {
          if (e.touches.length !== 1) return false;
          var x = e.touches[0].clientX;
          return x <= EDGE_PX || x >= window.innerWidth - EDGE_PX;
        }
        ['touchstart', 'touchmove'].forEach(function (type) {
          document.addEventListener(type, function (e) { if (startsAtEdge(e)) e.preventDefault(); }, { passive: false });
        });
      })();
    </script>
    <style>
      /* iOS-Homescreen-App: randlos. Auras Theme-Hintergrund fuellt die ganze
         Flaeche bis an alle Kanten -> kein toter Balken oben/unten. Der Inhalt
         wird nur aus Dynamic Island (oben) und Home-Indicator (unten) gehalten,
         der Hintergrund laeuft darunter durch. */
      /* Seitliches Wischen auf Seitenebene sperren: pan-x hier erlaubte dem
         Browser, ein Wischen von links/rechts als "Zurueck/Vor im Verlauf"
         zu deuten (Chrome/Edge-Randgeste, iOS-Homescreen-App-Randgeste).
         Vertikales Scrollen (pan-y) bleibt erlaubt. overscroll-behavior-x
         nimmt Chrome zusaetzlich die Randgeste weg. Einzelne Widgets, die
         selbst seitlich scrollen (Tableiste, Karussell, Wetterstreifen, ...),
         erlauben pan-x lokal wieder - siehe .overflow-x-auto in index.css
         und die betroffenen Widget-Dateien. */
      html, body { background: var(--app-bg, #0f172a); touch-action: pan-y; overscroll-behavior-x: none; }
      /* Vollbild bis zur PHYSISCHEN Unterkante. iOS gibt einer Homescreen-Web-App
         ein Fenster, das um env(safe-area-inset-bottom) (Home-Indicator, ~34px)
         kuerzer ist als der Screen (per Messung belegt: innerHeight endet 34px
         ueber der Kante). Deshalb Hoehe = 100dvh + safe-area-inset-bottom, damit
         der Inhalt die Home-Indicator-Zone mitfuellt (kein toter Streifen unten).
         KEIN position:fixed (reicht auf iOS nicht in die Zone). Gummiband gesperrt
         per overflow:hidden + overscroll-behavior. Nur Frontend (:has(.aura-page)),
         Admin bleibt normal scrollbar. */
      html:has(.aura-page), body:has(.aura-page) {
        height: calc(100dvh + env(safe-area-inset-bottom));
        min-height: calc(100dvh + env(safe-area-inset-bottom));
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* Body als Flex-Spalte, #root fuellt sie per flex:1 -> die volle Hoehe
         propagiert bis .aura-page/Scroll durch (die height:100%-Prozentkette
         propagiert auf iOS NICHT sauber bis #root). */
      body:has(.aura-page) { display: flex; flex-direction: column; }
      #root { flex: 1 1 auto; min-height: 0; }
      /* Seitliche Notch-Raender: .aura-page haelt den Inhalt aus der Safe-Area
         (links/rechts) heraus. Der Hintergrund dieser Streifen ist das dunkle
         --app-bg (Inline-Style von .aura-page) -> UNTER der Tab-Leiste "atmen" die
         Seitenstreifen im gleichen Dunkelblau wie der Inhalt (nicht eingeklemmt). */
      .aura-page {
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      /* Kopfzeile UND Tab-Leiste randlos (full-bleed): ihre Flaeche (--app-surface)
         und ihre untere Trennlinie laufen ueber die GANZE Breite - auch durch die
         Notch-Streifen. Dazu per negativer Margin bis an die Bildschirmkante ziehen
         und die Safe-Area als Innenabstand wieder aufschlagen, damit Logo/Tabs NICHT
         unter die Notch rutschen. Die Kopfzeile zieht zusaetzlich bis unter die
         Statusleiste (env(safe-area-inset-top)). Desktop: env(...) = 0 -> kein Effekt. */
      .aura-page .aura-header {
        margin-left: calc(-1 * env(safe-area-inset-left));
        margin-right: calc(-1 * env(safe-area-inset-right));
        padding-top: calc(0.5rem + env(safe-area-inset-top));
        padding-bottom: 0.5rem;
        padding-left: calc(1rem + env(safe-area-inset-left));
        padding-right: calc(1rem + env(safe-area-inset-right));
      }
      .aura-page .aura-tabs {
        margin-left: calc(-1 * env(safe-area-inset-left));
        margin-right: calc(-1 * env(safe-area-inset-right));
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      /* NUR der Dashboard-Inhalt scrollt (bei Bedarf) und haelt einen Abstand
         zum Home-Indicator. overscroll-behavior stoppt das Weiterziehen auf
         die ganze Seite. Nicht die Tab-Leiste/Widget-Zeilen (gleiche Klasse).
         War frueher 0.25rem: bei hohem Tab-Inhalt (z.B. zwei gestapelten
         Wetter-Widgets) reichte das auf iOS Safari nicht - die letzte Zeile
         war nur waehrend des elastischen Ueberzieh-Gummibands sichtbar und
         verschwand beim Loslassen wieder (normales Scrollen kam nicht ganz
         bis ans Ende). Grosszuegigerer Puffer behebt das unabhaengig vom
         genauen iOS-Mechanismus. KEIN env(safe-area-inset-bottom) hier - das
         wuerde die bewusste "Inhalt fuellt bis zur physischen Kante"-Vollbild-
         Loesung oben (100dvh + sab) wieder mit einer toten Zone unterlaufen. */
      .aura-page .aura-scroll.inset-0 {
        padding-bottom: 4rem;
        overscroll-behavior: contain;
      }
      #aura-boot {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px;
        background: #0f172a; color: #94a3b8;
        font-family: system-ui, sans-serif; font-size: 13px;
        z-index: 9999;
        transition: opacity 0.25s ease-out;
      }
      #aura-boot.hidden { opacity: 0; pointer-events: none; }
      #aura-boot-bar-wrap {
        position: absolute; top: 0; left: 0; right: 0; height: 2px;
        background: rgba(255,255,255,0.08);
      }
      #aura-boot-bar {
        height: 100%; background: #6366f1;
        animation: aura-slide 1.4s ease-in-out infinite;
      }
      #aura-boot-spinner {
        width: 28px; height: 28px; border-radius: 50%;
        border: 2px solid #6366f1; border-top-color: transparent;
        animation: aura-spin 0.7s linear infinite;
      }
      @keyframes aura-slide {
        0%   { transform: translateX(-100%) scaleX(0.3); }
        50%  { transform: translateX(0%)    scaleX(0.7); }
        100% { transform: translateX(100%) scaleX(0.3); }
      }
      @keyframes aura-spin {
        to { transform: rotate(360deg); }
      }
    </style>
